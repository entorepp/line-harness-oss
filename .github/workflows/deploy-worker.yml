name: Deploy Worker

on:
  workflow_dispatch:

concurrency:
  group: flat-harness-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Require the production branch
        run: test "$GITHUB_REF_NAME" = 'production/flat-harness-worker'
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Verify source, message contracts and exact production bytes
        run: node scripts/deploy-worker-production.mjs --deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worker-release-evidence
          path: apps/worker/.wrangler/production-release/*.json
