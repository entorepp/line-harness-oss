name = "line-flattravel"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# API_KEY and META_VERIFY_TOKEN are set via `wrangler secret put`
# Do NOT hardcode secrets here

[vars]
WORKER_URL = "https://line-flattravel.flat-travel.workers.dev"
WEB_APP_URL = "https://line-crm-web-2ob.pages.dev"
FORMS_APP_URL = "https://liffform-studio.pages.dev"

[[d1_databases]]
binding = "DB"
database_name = "line-crm"
database_id = "30c0fa9b-3b5c-468e-bc49-873c531c97d0"

[[kv_namespaces]]
binding = "UPLOADS"
id = "184a9482110e47eaab42fecd655f00ef"

[triggers]
crons = ["* * * * *"]

# Keep provider-webhook invocation logs available for production diagnostics.
# Secrets, request bodies, and authorization headers must never be logged.
[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true
