<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Flat Travel | Post-trip Feedback</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8faf7;color:#20382d;font:17px/1.6 system-ui,sans-serif}main{max-width:820px;margin:auto;padding:40px 20px 70px}.brand{font-weight:750;letter-spacing:.12em;color:#1d5c47;font-size:14px}h1{font-size:clamp(30px,6vw,44px);line-height:1.2}h2{font-size:21px}section{margin:22px 0;background:white;border:1px solid #dce6df;border-radius:18px;padding:25px}label.title,legend{font-weight:650;display:block;margin-bottom:12px}fieldset{border:0;padding:0;margin:0;min-width:0}input[type=text],input[type=email],textarea{font:inherit;width:100%;border:1px solid #a8beb0;border-radius:9px;padding:13px;color:#20382d;background:white}textarea{min-height:120px;resize:vertical}input[type=checkbox],input[type=radio]{width:21px;height:21px;flex-shrink:0;accent-color:#1d5c47}.choice{display:flex;align-items:flex-start;gap:10px;margin:12px 0;cursor:pointer}.choice input{margin-top:4px}.hint{font-size:14px;color:#56685d}.required{font-size:12px;margin-left:8px;font-weight:500}.files{padding:0;list-style:none}.files li{display:flex;align-items:center;gap:12px;border-bottom:1px solid #e6ede8;padding:12px 0}.filename{flex:1;overflow-wrap:anywhere;min-width:0}button{font:inherit;border:0;border-radius:9px;padding:13px 20px;background:#1d5c47;color:white;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.remove{background:#eef3ef;color:#264b37;font-size:13px;padding:8px 12px}.picker{display:inline-block;padding:13px 20px;border-radius:9px;background:#eaf3ed;font-weight:650;cursor:pointer}.picker input{position:absolute;opacity:0;width:1px;height:1px}.picker:focus-within{outline:3px solid #78ad8e;outline-offset:3px}:focus-visible{outline:3px solid #78ad8e;outline-offset:2px}#error{color:#9e251b;background:#fff0ed;border-radius:9px;padding:15px}#status{white-space:pre-line;overflow-wrap:anywhere}#success{background:#e8f4ec;padding:28px;border-radius:18px}.actions{position:sticky;bottom:0;padding:16px 0;background:#f8faf7f5}a{color:#1d5c47}[hidden]{display:none!important}@media(max-width:500px){section{padding:19px}main{padding:25px 14px}button[type=submit]{width:100%}}
</style></head><body><main><div class="brand">FLAT TRAVEL</div><h1>How was your journey?</h1><p id="intro">Loading your feedback form…</p><p id="error" role="alert" hidden></p><form id="feedback" hidden><div id="fields"></div><p id="status" role="status" aria-live="polite"></p><div class="actions"><button id="submit" type="submit">Agree and send feedback</button></div></form><section id="success" hidden tabindex="-1"><h2>Thank you for sharing your journey!</h2><p>Your feedback and memories have been received. Marketing use is limited to the permissions you selected.</p></section><noscript>Please enable JavaScript to share your feedback, photos and videos.</noscript></main><script type="module" src="/post-trip-feedback.js?v=20261015-2"></script></body></html>
